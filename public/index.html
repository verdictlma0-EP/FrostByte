<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Frostbyte OS</title>

<link rel="stylesheet" href="index.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Handjet:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="topbar">

  <div class="nav">
    <button onclick="back()">←</button>
    <button onclick="forward()">→</button>
    <button onclick="reload()">⟳</button>
  </div>

  <!-- tabs get injected here by renderTabs(). -->
  <div class="tabs" id="tabs">
    <button class="tab-add" onclick="newTab()">＋</button>
  </div>

  <div class="right-tools">
    <div class="clock" id="clock"></div>
    <div class="snowflake">❄️</div>
  </div>

</div>

<div class="center">

  <h1 class="logo">Frostbyte OS</h1>

  <input id="search" placeholder="Search or enter URL..." autocomplete="off"/>

  <div class="side-tools">

    <div class="engine-indicator">
      <span class="engine-dot"></span>
      <span id="engine-label">scramjet</span>
    </div>

    <select id="engine-select"></select>

    <div class="settings-icon" onclick="openSettings()">⚙</div>

  </div>

</div>

<!-- I think this is the discord link -->
<div class="discord-popup" id="discord">
  <div class="discord-box">
    <p>Join our Discord?</p>
    <button onclick="joinDiscord()">Join</button>
    <button onclick="closeDiscord()">Close</button>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
