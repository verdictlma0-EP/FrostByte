services:
  - type: web
    name: ep-proxy-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: BACKEND_URL
        sync: false   # Set to your Render URL e.g. https://test-ujjc.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false   # Paste the full private key including -----BEGIN/END----- lines
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: scramfck
      - key: OWNER_EMAILS
        sync: false   # Comma-separated admin emails
